<!doctype html>
<html lang="en" data-brand="studio">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F3" />
    <script>
      // Apply the theme before app modules, styles, or saved models load.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("cmmf-theme");
        } catch {}
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#192329" : "#F6F7F3");
      })();
    </script>
    <style>
      :root[data-theme="light"] {
        color-scheme: light;
        background: #f6f7f3;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        background: #192329;
      }
      /* Keep the startup brand aligned with the responsive Studio header. */
      body {
        margin: 0;
      }
      .startup-header {
        box-sizing: border-box;
        height: 76px;
        display: flex;
        align-items: center;
        padding-left: 18px;
        border-bottom: 1px solid #d9dfda;
        background: #fff;
      }
      .startup-brand {
        display: flex;
        align-items: center;
      }
      .startup-header img {
        display: block;
        width: 208px;
        height: auto;
      }
      .startup-logo-dark,
      :root[data-theme="dark"] .startup-logo-light {
        display: none;
      }
      :root[data-theme="dark"] .startup-logo-dark {
        display: block;
      }
      :root[data-theme="dark"] .startup-header {
        background: #222e34;
        border-color: #425158;
      }
      @media (max-width: 1100px) {
        .startup-header {
          padding-left: 14px;
        }
      }
      @media (max-width: 750px) {
        .startup-header {
          height: 65px;
          padding-left: 10px;
        }
        .startup-header img {
          width: 132px;
        }
      }
      @media (max-width: 480px) {
        .startup-header {
          height: 104px;
          align-items: flex-start;
        }
        .startup-brand {
          height: 64px;
        }
      }
    </style>
    <link rel="icon" href="%BASE_URL%brand/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="%BASE_URL%brand/favicon.ico"
      sizes="16x16 32x32 48x48"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%brand/manifest.webmanifest" />
    <title>CMMF Studio</title>
  </head>
  <body>
    <div id="root">
      <!-- React replaces this header once the workspace is ready to render.
           Use the same source assets so the interactive logo is already cached. -->
      <header class="startup-header">
        <div class="startup-brand">
          <picture class="startup-logo-light">
            <source
              media="(max-width: 750px)"
              width="501"
              height="200"
              srcset="
                /src/assets/brand/studio-header-compact-gradient-light.svg
              "
            />
            <img
              src="/src/assets/brand/studio-header-horizontal-gradient-light.svg"
              alt="CMMF Studio"
              fetchpriority="high"
              width="765"
              height="256"
            />
          </picture>
          <picture class="startup-logo-dark">
            <source
              media="(max-width: 750px)"
              width="501"
              height="200"
              srcset="/src/assets/brand/studio-header-compact-gradient-dark.svg"
            />
            <img
              src="/src/assets/brand/studio-header-horizontal-gradient-dark.svg"
              alt="CMMF Studio"
              fetchpriority="high"
              width="765"
              height="256"
            />
          </picture>
        </div>
      </header>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
