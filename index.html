<!doctype html>
<html lang="en" data-brand="studio">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F7F3" />
    <script>
      // Apply the theme before app modules, styles, or saved models load.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem("cmmf-theme");
        } catch {}
        const theme =
          saved === "dark" || saved === "light"
            ? saved
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute("content", theme === "dark" ? "#192329" : "#F6F7F3");
      })();
    </script>
    <style>
      :root[data-theme="light"] {
        color-scheme: light;
        background: #f6f7f3;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        background: #192329;
      }
    </style>
    <link rel="icon" href="%BASE_URL%brand/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      href="%BASE_URL%brand/favicon.ico"
      sizes="16x16 32x32 48x48"
    />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%brand/manifest.webmanifest" />
    <title>CMMF Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
